<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title data-i18n="page-title">Support Andrew</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Support Andrew with a small tip. Secure payment via Stripe." />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <main class="container">
        <div class="card">

            <!-- LANG SWITCHER -->
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="ua">UA</button>
            </div>

            <!-- HEADER -->
            <div class="header">
                <div class="header-text">
                    <h1 data-i18n="header-h1">Support Andrew</h1>
                    <p class="subtitle" data-i18n-html="subtitle">
                        Liked my content?<br>Support with a quick tip.
                    </p>
                </div>

                <img src="profile.jpg" alt="Andrew">
            </div>

            <!-- PRESET BUTTONS -->
            <div class="preset-row">
                <button class="preset" data-amount="3">
                    <span class="preset-amount">£3</span>
                    <small data-i18n="preset-3-label">Thank you</small>
                </button>

                <button class="preset" data-amount="5">
                    <span class="preset-amount">£5</span>
                    <small data-i18n="preset-5-label">Cheers</small>
                </button>

                <button class="preset" data-amount="10">
                    <span class="preset-amount">£10</span>
                    <small data-i18n="preset-10-label">Made my day</small>
                </button>
            </div>

            <div class="preset-row">
                <button class="preset wide" data-amount="51">
                    <span class="preset-amount">£50+</span>
                    <small data-i18n="preset-50-label">You are the best</small>
                </button>
            </div>

            <!-- AMOUNT + CURRENCY -->
            <div class="amount-row">
                <input id="amount"
                       type="number"
                       min="1"
                       step="1"
                       value="3"
                       aria-label="Amount" />

                <select id="currency" aria-label="Currency">
                    <option value="GBP">GBP £</option>
                    <option value="EUR">EUR €</option>
                    <option value="USD">USD $</option>
                </select>
            </div>

            <!-- FROM -->
            <input id="fromName"
                   type="text"
                   data-i18n-placeholder="from-placeholder"
                   placeholder="From (optional)"
                   maxlength="30" />

            <p></p>

            <!-- MESSAGE -->
            <textarea id="message"
                      maxlength="250"
                      data-i18n-placeholder="message-placeholder"
                      placeholder="Write a short message (optional)"></textarea>

            <div id="charHint" class="char-hint" hidden>
                <span data-i18n="char-hint">Maximum 250 characters reached</span>
            </div>

            <!-- AGREE -->
            <div class="agree">
                <input type="checkbox" id="agree" />

                <label for="agree" data-i18n-html="agree-full">
                    I agree to the
                    <a href="policy/terms.html" target="_blank">Terms</a>,
                    <a href="policy/privacy.html" target="_blank">Privacy</a> &amp;
                    <a href="policy/refund.html" target="_blank">Refund Policy</a>.
                </label>
            </div>

            <!-- STRIPE BUTTON -->
            <button id="tipBtn" disabled data-i18n="stripe-btn">
                Send Tip (via Stripe)
            </button>

            <!-- DONATION ALERTS BUTTON -->
            <button id="daBtn" disabled data-i18n="da-btn">
                Send with Donation Alerts
            </button>

            <!-- PAYMENT ICONS -->
            <div class="payments">
                <img src="icons/applepay.svg" alt="Apple Pay">
                <img src="icons/googlepay.svg" alt="Google Pay">
                <img src="icons/visa.svg" alt="Visa">
                <img src="icons/mastercard.svg" alt="Mastercard">
            </div>

            <!-- SECURITY NOTE -->
            <p class="secure-note" data-i18n="secure-note">
                🔒 Secured payment powered by Stripe
            </p>

        </div>
    </main>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
